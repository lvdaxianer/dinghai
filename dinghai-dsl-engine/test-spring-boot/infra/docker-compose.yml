name: dinghai-dsl-engine-it

services:
  mysql:
    image: mysql:8.4.3
    environment:
      MYSQL_ROOT_PASSWORD: ${DINGHAI_IT_MYSQL_ROOT_PASSWORD:-dinghai_local_only}
      MYSQL_DATABASE: dinghai_test
      MYSQL_USER: dinghai_test
      MYSQL_PASSWORD: ${DINGHAI_IT_DB_PASSWORD:-dinghai_local_only}
    ports:
      - "${DINGHAI_IT_MYSQL_PORT:-13306}:3306"
    volumes:
      - ./mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 5s
      timeout: 5s
      retries: 30

  postgres:
    image: postgres:16.4
    environment:
      POSTGRES_DB: dinghai_test
      POSTGRES_USER: dinghai_test
      POSTGRES_PASSWORD: ${DINGHAI_IT_DB_PASSWORD:-dinghai_local_only}
    ports:
      - "${DINGHAI_IT_POSTGRES_PORT:-15432}:5432"
    volumes:
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dinghai_test -d dinghai_test"]
      interval: 5s
      timeout: 5s
      retries: 30

  doris:
    image: ${DINGHAI_IT_DORIS_IMAGE:-apache/doris:all-in-one-4.1.3}
    ports:
      - "${DINGHAI_IT_DORIS_HTTP_PORT:-18030}:8030"
      - "${DINGHAI_IT_DORIS_PORT:-19030}:9030"
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'cat < /dev/null > /dev/tcp/127.0.0.1/9030'"]
      interval: 5s
      timeout: 5s
      retries: 60

  doris-init:
    image: mysql:8.4.3
    depends_on:
      doris:
        condition: service_healthy
    volumes:
      - ./doris/init:/init:ro
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        database_ready=0;
        for attempt in $$(seq 1 90); do
        if mysql --protocol=TCP -h doris -P 9030 -uroot -e "CREATE DATABASE IF NOT EXISTS dinghai_test";
        then database_ready=1; break; fi; sleep 2; done;
        if [ "$$database_ready" -ne 1 ]; then exit 1; fi;
        backend_ready=0;
        for attempt in $$(seq 1 90); do
        if mysql --protocol=TCP -h doris -P 9030 -uroot -N -B -e "SHOW BACKENDS" | awk -F '\t' '$$10 == "true" { found=1 } END { exit(found ? 0 : 1) }';
        then backend_ready=1; break; fi; sleep 2; done;
        if [ "$$backend_ready" -ne 1 ]; then echo "Doris backend did not become alive" >&2; exit 1; fi;
        for attempt in $$(seq 1 90); do
        schema_output=$$(mktemp);
        mysql --protocol=TCP -h doris -P 9030 -uroot dinghai_test < /init/01-schema.sql >"$$schema_output" 2>&1 || true;
        if ! grep -q "ERROR" "$$schema_output";
        then rm -f "$$schema_output"; exit 0; fi;
        cat "$$schema_output" >&2; rm -f "$$schema_output"; sleep 2; done;
        echo "Doris backend did not become ready for test schema" >&2; exit 1

