services:
  backend:
    build:
      context: ./backend
    ports:
      - "${SERVER_PORT:-8080}:8080"
    env_file:
      - .env
    environment:
      PRODUCTIQ_SQLITE_PATH: /var/lib/productiq/productiq.db
      PRODUCTIQ_TRUSTED_DIRECTORY: /var/lib/productiq/knowledge
      PRODUCTIQ_CHAT_TIMEOUT: ${PRODUCTIQ_CHAT_TIMEOUT:-90s}
      PRODUCTIQ_RUNTIME_MODE: ${PRODUCTIQ_RUNTIME_MODE:-remote}
      PRODUCTIQ_GATEWAY_BASE_URL: ${PRODUCTIQ_GATEWAY_BASE_URL:?PRODUCTIQ_GATEWAY_BASE_URL is required}
      PRODUCTIQ_GATEWAY_API_KEY: ${PRODUCTIQ_GATEWAY_API_KEY:?PRODUCTIQ_GATEWAY_API_KEY is required}
      PRODUCTIQ_EMBEDDING_MODEL: ${PRODUCTIQ_EMBEDDING_MODEL:?PRODUCTIQ_EMBEDDING_MODEL is required}
      PRODUCTIQ_RERANK_MODEL: ${PRODUCTIQ_RERANK_MODEL:?PRODUCTIQ_RERANK_MODEL is required}
      PRODUCTIQ_ANSWER_MODEL: ${PRODUCTIQ_ANSWER_MODEL:?PRODUCTIQ_ANSWER_MODEL is required}
      PRODUCTIQ_EMBEDDING_DIMENSIONS: ${PRODUCTIQ_EMBEDDING_DIMENSIONS:?PRODUCTIQ_EMBEDDING_DIMENSIONS is required}
      PRODUCTIQ_EMBEDDING_TIMEOUT: ${PRODUCTIQ_EMBEDDING_TIMEOUT:-15s}
      PRODUCTIQ_RERANK_TIMEOUT: ${PRODUCTIQ_RERANK_TIMEOUT:-20s}
      PRODUCTIQ_QDRANT_URL: ${PRODUCTIQ_QDRANT_URL:-http://qdrant:6333}
      PRODUCTIQ_QDRANT_COLLECTION: ${PRODUCTIQ_QDRANT_COLLECTION:-product-knowledge-v1}
      PRODUCTIQ_QDRANT_TIMEOUT: ${PRODUCTIQ_QDRANT_TIMEOUT:-5s}
      PRODUCTIQ_INDEX_WORKER_BATCH_SIZE: ${PRODUCTIQ_INDEX_WORKER_BATCH_SIZE:-20}
      PRODUCTIQ_INDEX_WORKER_INTERVAL: ${PRODUCTIQ_INDEX_WORKER_INTERVAL:-10s}
    volumes:
      - productiq-data:/var/lib/productiq
      - productiq-knowledge:/var/lib/productiq/knowledge
    depends_on:
      qdrant:
        condition: service_healthy
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:v1.15.1
    ports:
      - "${QDRANT_PORT:-6333}:6333"
    volumes:
      - productiq-qdrant:/qdrant/storage
    healthcheck:
      test: ["CMD", "wget", "--spider", "--quiet", "http://localhost:6333/readyz"]
      interval: 10s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  productiq-data:
  productiq-knowledge:
  productiq-qdrant:
