<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>产品知识问答设置</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main class="popup-shell">
    <h1>连接设置</h1>
    <form id="settings-form">
      <label for="base-url">后端基础地址</label>
      <input id="base-url" name="baseUrl" type="url" required placeholder="http://localhost:8080">
      <label for="client-key">客户端键（可选）</label>
      <input id="client-key" name="clientKey" type="password" maxlength="256" autocomplete="off">
      <div class="form-actions">
        <button type="submit">保存设置</button>
      </div>
    </form>
    <p id="settings-status" class="status" role="status" aria-live="polite"></p>
  </main>
  <script type="module" src="options.js"></script>
</body>
</html>
